spring:
  application:
    name: backend-unavaliability

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE}
      auto-commit: true

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false


  mail:
    host: ${RESEND_HOST}
    port: ${RESEND_PORT:587}
    username: ${RESEND_USER}
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  forward-headers-strategy: framework

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${SESSION_SECRET}
    expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000
  mail:
    from: ${RESEND_FROM}
  security:
    require-https: false
    hsts-max-age-seconds: 31536000
    lockout:
      threshold: 5
      minutes: 15
  setores:
    file: setores.json
